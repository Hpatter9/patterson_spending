<title>Patterson Spending</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: household ledger. Sticky header + tab rail, summary figures first, detail below in one column that widens to two on desktop. */
:root {
  --bg: #f2f5f3;
  --surface: #ffffff;
  --ink: #13201a;
  --ink-2: #48574f;
  --muted: #74827b;
  --line: #dbe2de;
  --accent: #1d6a54;
  --accent-soft: #d9ebe3;
  --bar-rest: #a9cbbd;
  --good: #23803a;
  --warn: #a86f00;
  --warn-fill: #e9a315;
  --crit: #c23838;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #18201c; --ink: #e8efeb; --ink-2: #b3c0b9; --muted: #84928b;
    --line: #29332e; --accent: #5cc29e; --accent-soft: #1d3a30; --bar-rest: #2f6553;
    --good: #4cbf5a; --warn: #f0b429; --warn-fill: #f0b429; --crit: #ec6a66; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #18201c; --ink: #e8efeb; --ink-2: #b3c0b9; --muted: #84928b;
  --line: #29332e; --accent: #5cc29e; --accent-soft: #1d3a30; --bar-rest: #2f6553;
  --good: #4cbf5a; --warn: #f0b429; --warn-fill: #f0b429; --crit: #ec6a66; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 14px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; flex: 1 1 auto; min-width: 0; }
.brand h1 { font-size: 1.45rem; }
.brand span { color: var(--muted); font-size: .85rem; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.chip.good { color: var(--good); } .chip.warn { color: var(--warn); } .chip.crit { color: var(--crit); }
.chip.demo { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; width: 100%; scrollbar-width: none; }
nav.tabs button { background: none; border: 0; padding: 10px 12px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:hover { color: var(--ink); }

main.wrap { padding-block: 20px 48px; display: grid; gap: 20px; }
.notice { padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); color: var(--ink); font-size: .9rem; }
.notice.crit { background: color-mix(in srgb, var(--crit) 14%, var(--surface)); }

.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.fig { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.fig .label { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.fig .value { font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; line-height: 1.2; margin-top: 2px; }
.fig .sub { color: var(--ink-2); font-size: .85rem; }

.cols { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .cols { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } }
section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; display: grid; gap: 14px; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel-head p { margin: 0; color: var(--muted); font-size: .85rem; }

.budget-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.budget-row .name { font-weight: 600; }
.budget-row .nums { color: var(--ink-2); font-size: .9rem; text-align: right; }
.track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.track b { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.track .pace { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink-2); opacity: .5; }
.status { font-size: .75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-good { color: var(--good); } .s-warn { color: var(--warn); } .s-crit { color: var(--crit); }
.fill-good { background: var(--good); } .fill-warn { background: var(--warn-fill); } .fill-crit { background: var(--crit); }
.limit-input { width: 88px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); text-align: right; }

.hbar { display: grid; grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .9rem; }
.hbar .bar { height: 14px; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar .amt { text-align: right; color: var(--ink-2); min-width: 72px; }
.hbar .cat { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; white-space: nowrap; }
.scroll { overflow-x: auto; }
.payee { font-weight: 500; }
.payee small { display: block; color: var(--muted); font-weight: 400; }
.pos { color: var(--good); }
.pill { font-size: .72rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.muted { background: var(--line); color: var(--ink-2); }
select.cat-select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 2px 4px; max-width: 150px; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.controls input, .controls select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-width: 0; }
.controls input[type="search"] { flex: 1 1 200px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.link { border: 0; background: none; color: var(--muted); padding: 2px 6px; font-weight: 500; }
.btn.link:hover { color: var(--crit); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }

svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font: 13px var(--font-body); font-variant-numeric: tabular-nums; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .hit { fill: transparent; cursor: default; }

.acct-group { display: grid; gap: 4px; }
.acct-group h3 { font-size: .8rem; font-family: var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 6px; }
.acct { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.acct .meta { color: var(--muted); font-size: .82rem; }
.acct .bal { font-weight: 600; text-align: right; }
.acct .edit { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--ink-2); align-items: center; }
.acct .edit input { width: 84px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.util { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.util b { display: block; height: 100%; border-radius: 3px; }

.bill { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.bill .date { width: 52px; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; line-height: 1.1; }
.bill .date b { display: block; font-family: var(--font-display); font-size: 1.3rem; }
.bill .date span { font-size: .7rem; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
.bill.paid { opacity: .55; }
.bill .right { text-align: right; display: grid; gap: 2px; justify-items: end; }
.bill label { font-size: .82rem; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
form.add { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); align-items: end; }
form.add label { display: grid; gap: 2px; font-size: .78rem; color: var(--muted); }
form.add input, form.add select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 8px; width: 100%; }

.ask { gap: 12px; }
.thread { display: grid; gap: 12px; max-height: min(60vh, 560px); overflow-y: auto; padding-right: 4px; }
.thread .intro { color: var(--ink-2); margin: 0; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.55; overflow-wrap: anywhere; }
.msg.user { justify-self: end; background: var(--accent); color: var(--bg); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.assistant { justify-self: start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
.msg ul, .msg ol { margin: 4px 0 8px; padding-left: 20px; }
.msg-err { color: var(--crit); font-size: .85rem; }
.thinking { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .thinking { animation: pulse 1.4s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .4; } } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .85rem; text-align: left; }
.chip-btn:hover { border-color: var(--accent); }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1 1 auto; min-width: 0; resize: vertical; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; font: inherit; }
@media (max-width: 520px) { .msg { max-width: 100%; } }
.add-acct { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; }
.add-acct summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.add-acct[open] { display: grid; gap: 8px; }
.add-acct .meta { margin: 0; color: var(--muted); font-size: .85rem; }
.empty { color: var(--muted); padding: 24px 8px; text-align: center; }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: .8rem; max-width: 240px; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: .85rem; z-index: 30; }
@media (prefers-reduced-motion: no-preference) { .track b, .hbar .bar, .util b { transition: width .3s ease; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Patterson Spending</h1><span id="monthLabel"></span></div>
    <span id="syncChip" class="chip"><i></i>Connecting…</span>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-tab="month" aria-selected="true">This Month</button>
      <button role="tab" data-tab="where" aria-selected="false">Where It Goes</button>
      <button role="tab" data-tab="worth" aria-selected="false">Net Worth &amp; Debt</button>
      <button role="tab" data-tab="bills" aria-selected="false">Bills</button>
      <button role="tab" data-tab="ask" aria-selected="false">Ask</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app">
  <div class="empty">Loading your household numbers…</div>
</main>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const CATEGORIES = ["Groceries","Dining","Shopping","Gas","Transportation","Utilities","Subscriptions","Insurance","Health","Home","Kids","Travel","Entertainment","Games","Gifts","Fees","Income","Transfer","Uncategorized"];
const NOT_SPENDING = new Set(["Income","Transfer"]);
const S = { tab: "month", accounts: [], txns: [], balances: [], budgets: [], bills: [], meta: null, db: null, canWrite: true,
  ready: { accounts: false, txns: false }, sample: undefined, sampleTools: false, chat: [], draft: "", asking: null, whereMonth: null, search: "", catFilter: "", error: null };

const usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const usd0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "x";
const pad = n => String(n).padStart(2, "0");
const ym = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const today = new Date();
const thisMonth = ym(today);
const monthName = (key, style = "long") => new Date(+key.slice(0, 4), +key.slice(5, 7) - 1, 1).toLocaleString("en-US", { month: style, year: style === "long" ? "numeric" : undefined });
const lastMonths = n => Array.from({ length: n }, (_, i) => ym(new Date(today.getFullYear(), today.getMonth() - (n - 1 - i), 1)));
const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();

try { const t = localStorage.getItem("ps-tab"); if (t) S.tab = t; } catch (e) {}
if (/^#(month|where|worth|bills|ask)$/.test(location.hash)) S.tab = location.hash.slice(1);

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
async function write(fn, okMsg) {
  if (!S.db) return toast("Sign in to claude.ai to make changes.");
  try { await fn(S.db); if (okMsg) toast(okMsg); }
  catch (e) { toast(e?.code === "not_granted" ? "You have view-only access. Ask the owner for Contributor access." : "Couldn't save. Check your connection and try again."); }
}

/* ---------- derived numbers ---------- */
const isSpend = t => !NOT_SPENDING.has(t.category);
function spendByCat(month) {
  const m = new Map();
  for (const t of S.txns) if (t.date?.startsWith(month) && isSpend(t)) m.set(t.category, (m.get(t.category) || 0) - t.amount);
  return m;
}
const total = m => [...m.values()].reduce((a, b) => a + b, 0);
const incomeFor = month => S.txns.filter(t => t.date?.startsWith(month) && t.category === "Income").reduce((a, t) => a + t.amount, 0);
const isAsset = a => a.type === "checking" || a.type === "savings";
const isLiability = a => a.type === "credit" || a.type === "loan";
function nextDue(bill) {
  const midnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const on = offset => { const f = new Date(today.getFullYear(), today.getMonth() + offset, 1);
    const dim = new Date(f.getFullYear(), f.getMonth() + 1, 0).getDate();
    return new Date(f.getFullYear(), f.getMonth(), Math.min(bill.dueDay || 1, dim)); };
  const date = bill.paidMonth === thisMonth ? on(1) : on(0);
  const days = Math.round((date - midnight) / 864e5);
  return { date, days, overdue: days < 0 };
}
function budgetStatus(spent, limit) {
  if (!limit) return null;
  const r = spent / limit;
  if (r > 1) return ["crit", "Over"];
  if (r >= 0.85 || r > (today.getDate() / daysInMonth) + 0.15) return ["warn", "Ahead of pace"];
  return ["good", "On track"];
}

/* ---------- charts ---------- */
function niceTicks(max, count = 4) {
  if (max <= 0) return [0, 1];
  const raw = max / count, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s >= raw);
  const ticks = []; for (let v = 0; v <= max + step * 0.001; v += step) ticks.push(v);
  if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
  return ticks;
}
const short = v => { const a = Math.abs(v), sign = v < 0 ? "-" : "";
  return sign + (a >= 1e6 ? `$${(a / 1e6).toFixed(1)}M` : a >= 1e3 ? `$${(a / 1e3).toFixed(a >= 1e4 ? 0 : 1)}k` : `$${Math.round(a)}`); };

function monthBars(months, values, current) {
  const W = 480, H = 200, L = 50, B = 24, T = 10, R = 8;
  const ticks = niceTicks(Math.max(...values, 1)), top = ticks[ticks.length - 1];
  const y = v => T + (H - T - B) * (1 - v / top), slot = (W - L - R) / months.length, bw = Math.min(44, slot * 0.6);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending by month">`;
  for (const t of ticks) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${short(t)}</text>`;
  months.forEach((m, i) => {
    const x = L + slot * i + (slot - bw) / 2, h = Math.max(0, y(0) - y(values[i])), r = Math.min(4, h);
    const fill = m === current ? "var(--accent)" : "var(--bar-rest)";
    if (h > 0) s += `<path d="M${x},${y(0)} v${-(h - r)} q0,${-r} ${r},${-r} h${bw - 2 * r} q${r},0 ${r},${r} v${h - r} z" fill="${fill}"/>`;
    s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" style="${m === current ? "fill:var(--ink);font-weight:600" : ""}">${monthName(m, "short")}</text>`;
    s += `<rect class="hit" x="${L + slot * i}" y="${T}" width="${slot}" height="${H - T - B}" data-tip="${esc(monthName(m))}: ${esc(usd0.format(values[i]))} spent" data-month="${m}"/>`;
  });
  return s + `</svg>`;
}

function lineChart(points) {
  const W = 480, H = 210, L = 56, B = 24, T = 12, R = 14;
  if (points.length < 2) return `<p class="empty">The trend line appears after two days of syncs.</p>`;
  const vals = points.map(p => p.v); let lo = Math.min(...vals), hi = Math.max(...vals);
  const padv = (hi - lo) * 0.15 || Math.abs(hi) * 0.05 || 100; lo -= padv; hi += padv;
  const t0 = +new Date(points[0].d), t1 = +new Date(points[points.length - 1].d);
  const x = d => L + (W - L - R) * ((+new Date(d) - t0) / (t1 - t0 || 1)), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const step = (hi - lo) / 4;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net worth over time">`;
  for (let i = 0; i <= 4; i++) { const v = lo + step * i; s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`; }
  if (lo < 0 && hi > 0) s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink-2)" stroke-dasharray="3 3"/>`;
  const line = points.map((p, i) => `${i ? "L" : "M"}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  s += `<path d="${line} L${x(points[points.length - 1].d)},${H - B} L${L},${H - B} Z" fill="var(--accent)" fill-opacity=".12"/>`;
  s += `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  const last = points[points.length - 1];
  s += `<circle cx="${x(last.d)}" cy="${y(last.v)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  const fmt = d => new Date(d + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
  s += `<text x="${L}" y="${H - 6}">${fmt(points[0].d)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmt(last.d)}</text>`;
  const seg = (W - L - R) / points.length;
  points.forEach(p => s += `<rect class="hit" x="${x(p.d) - Math.max(seg, 6) / 2}" y="${T}" width="${Math.max(seg, 6)}" height="${H - T - B}" data-tip="${esc(fmt(p.d))}: ${esc(usd0.format(p.v))}"/>`);
  return s + `</svg>`;
}

function payoff(balance, aprPct, payment) {
  const B = Math.abs(balance), r = (+aprPct || 0) / 1200, P = +payment || 0;
  if (!B || !P) return null;
  if (r === 0) return { months: Math.ceil(B / P), interest: 0 };
  if (P <= B * r) return { never: true };
  const n = Math.ceil(-Math.log(1 - (r * B) / P) / Math.log(1 + r));
  return { months: n, interest: Math.max(0, P * n - B) };
}

function financeSnapshot() {
  const months = lastMonths(7), full = months.slice(0, 6), recent = months.slice(3, 6);
  const lines = [`Today: ${today.toDateString()} (day ${today.getDate()} of ${daysInMonth}).`];
  if (S.accounts.some(a => a.demo)) lines.push("NOTE: these are example numbers, not the household's real accounts. Say so if relevant.");
  lines.push("", "ACCOUNTS (debts negative):");
  for (const a of S.accounts) lines.push(`- ${a.name} (${a.type}, ${a.institution}): ${usd.format(a.balance)}${a.apr != null ? `, APR ${a.apr}%` : ""}${a.limit ? `, limit ${usd0.format(a.limit)}` : ""}${a.payment ? `, payment ${usd0.format(a.payment)}/mo` : ""}`);
  const nw = S.accounts.reduce((s, a) => s + (+a.balance || 0), 0);
  const series = netWorthSeries(), past = d => series.filter(p => p.d <= d).pop();
  lines.push(`Net worth now ${usd0.format(nw)}` + [90, 180].map(n => { const p = past(new Date(today - n * 864e5).toISOString().slice(0, 10)); return p ? `; ${n} days ago ${usd0.format(p.v)}` : ""; }).join(""));
  lines.push("", `SPENDING BY CATEGORY PER MONTH (transfers and income excluded; ${monthName(thisMonth)} is partial):`);
  const byMonth = Object.fromEntries(months.map(m => [m, spendByCat(m)]));
  const cats = [...new Set(months.flatMap(m => [...byMonth[m].keys()]))];
  lines.push(`category | ${months.map(m => monthName(m, "short")).join(" | ")} | budget`);
  for (const c of cats) lines.push(`${c} | ${months.map(m => Math.round(byMonth[m].get(c) || 0)).join(" | ")} | ${S.budgets.find(b => b.category === c)?.limit ?? "-"}`);
  lines.push(`TOTAL | ${months.map(m => Math.round(total(byMonth[m]))).join(" | ")} | ${S.budgets.reduce((a, b) => a + (+b.limit || 0), 0)}`);
  lines.push(`INCOME | ${months.map(m => Math.round(incomeFor(m))).join(" | ")}`);
  const avg = f => recent.reduce((a, m) => a + f(m), 0) / recent.length;
  const acctType = new Map(S.accounts.map(a => [a.id, a.type]));
  const fixed = S.bills.filter(b => acctType.get(b.accountId) !== "credit").reduce((a, b) => a + (+b.amount || 0), 0);
  const inc = avg(incomeFor), sp = avg(m => total(byMonth[m]));
  lines.push(`Last 3 full months average: income ${usd0.format(inc)}, spending ${usd0.format(sp)}.`);
  lines.push(`Loan, mortgage and other non-card bills total ${usd0.format(fixed)}/month. Payments like these usually count as Transfers, so they are NOT in spending. Credit card payments cover spending already counted, so don't subtract them. Estimated money left each month: about ${usd0.format(inc - sp - fixed)}. If a bill below obviously already appears as a spending category, add it back.`);
  for (const b of S.budgets.filter(b => !cats.includes(b.category))) lines.push(`(budget with no spending yet: ${b.category} ${b.limit})`);
  lines.push("", "BILLS:");
  for (const b of S.bills) lines.push(`- ${b.name}: ${usd.format(+b.amount || 0)} due day ${b.dueDay}${b.autopay ? ", autopay" : ""}${b.paidMonth === thisMonth ? ", paid this month" : ""}`);
  if (!S.bills.length) lines.push("(none entered)");
  return lines.join("\n");
}
const COMPANION_RULES = `You are the money companion inside the Patterson household's budget dashboard. You answer questions about their finances using ONLY the data below and the find_transactions tool if it is available. Never invent numbers; if something isn't in the data, say what's missing.

How to answer:
- Lead with the direct answer in one or two sentences, then the supporting numbers.
- For a planned purchase: give 2-3 concrete ways to fit it in, using their real figures. For example: pay from savings and what that leaves; set aside a monthly amount for N months, naming which categories to trim and by how much, based on where they usually spend under or over budget; or split it. Then recommend one, with a target date. Flag high-APR card debt if paying that down first would be wiser. Don't suggest financing at a rate higher than their savings earn unless there's no other way.
- Keep it short: under about 180 words unless they ask for detail. Use short bullet lists and **bold** for key numbers. No tables, no headings.
- Be practical and kind, not preachy. Mention you're not a licensed financial advisor only when the question is about investing, taxes or legal matters.

HOUSEHOLD DATA:
`;
const md = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
  .replace(/^#{1,4}\s*(.+)$/gm, "<b>$1</b>")
  .replace(/(?:^|\n)((?:[-*•] .+(?:\n|$))+)/g, (_, list) => `\n<ul>${list.trim().split("\n").map(l => `<li>${l.replace(/^[-*•] /, "")}</li>`).join("")}</ul>\n`)
  .replace(/(?:^|\n)((?:\d+\. .+(?:\n|$))+)/g, (_, list) => `\n<ol>${list.trim().split("\n").map(l => `<li>${l.replace(/^\d+\. /, "")}</li>`).join("")}</ol>\n`)
  .trim().split(/\n{2,}/).map(p => /^<(ul|ol)>/.test(p) ? p : `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
const findTool = {
  name: "find_transactions",
  description: "Search the household's synced transactions from the last 7 months. Returns up to 40 matches, newest first: date, merchant, category, amount (negative = money out), account.",
  inputSchema: { type: "object", properties: {
    text: { type: "string", description: "Words to match in the merchant or description, e.g. 'amazon'" },
    category: { type: "string", description: "Exact category name, e.g. 'Dining'" },
    month: { type: "string", description: "Month as YYYY-MM" } } },
  execute(input) {
    const q = String(input.text || "").toLowerCase(), cat = String(input.category || ""), m = String(input.month || "");
    const acct = new Map(S.accounts.map(a => [a.id, a.name]));
    const rows = S.txns.filter(t => (!q || `${t.payee} ${t.description}`.toLowerCase().includes(q)) && (!cat || t.category === cat) && (!m || t.date?.startsWith(m)));
    return { matches: rows.length, total: Math.round(rows.reduce((a, t) => a + t.amount, 0) * 100) / 100,
      rows: rows.slice(0, 40).map(t => ({ date: t.date, merchant: t.payee || t.description, category: t.category, amount: t.amount, account: acct.get(t.accountId) || "" })) };
  },
};
const AI_ERRORS = {
  not_granted: "The companion needs your OK to use your Claude account. Reload the page and choose Allow when asked.",
  rate_limited: "Too many questions at once. Wait a minute, then send again.",
  prompt_too_large: "That conversation got too long. Select Clear and ask again.",
  refused: "Claude couldn't answer that one. Try rephrasing.",
  session_expired: "Your claude.ai sign-in expired. Reload the page.",
};
function viewAsk() {
  if (S.sample === null) return `<section class="panel"><h2>Ask about your money</h2><p class="empty">The companion only works when this page is open on claude.ai while you're signed in.</p></section>`;
  const msgs = S.chat.map((m, i) => `<div class="msg ${m.role}">${m.role === "user" ? esc(m.content) : m.content ? md(m.content) : `<span class="thinking">Thinking…</span>`}${m.error ? `<p class="msg-err">${esc(m.error)}</p>` : ""}</div>`).join("");
  return `<section class="panel ask">
    <div class="panel-head"><h2>Ask about your money</h2><p>Answers use the numbers on this dashboard${S.chat.length ? ` · <button class="btn link" id="chatClear">Clear</button>` : ""}</p></div>
    <div class="thread" id="thread">${msgs || `<p class="intro">Ask anything about your spending, debts or bills, or name something you want to buy and get a plan for fitting it in.</p>`}</div>
    ${S.chat.length ? "" : `<div class="chips">${SUGGESTIONS.map(s => `<button class="chip-btn" data-suggest="${esc(s)}">${esc(s)}</button>`).join("")}</div>`}
    <form class="composer" id="askForm">
      <textarea id="askInput" rows="2" maxlength="1000" placeholder="e.g. Can we afford a $2,345 e-bike this spring?" aria-label="Your question">${esc(S.draft)}</textarea>
      ${S.asking ? `<button class="btn" type="button" id="askStop">Stop</button>` : `<button class="btn primary" type="submit">Ask</button>`}
    </form>
  </section>`;
}
async function ask(question) {
  question = question.trim();
  if (!question || S.asking || !S.sample) return;
  S.chat.push({ role: "user", content: question });
  const reply = { role: "assistant", content: "" };
  S.chat.push(reply);
  S.draft = ""; S.asking = new AbortController();
  render(true); scrollThread();
  const history = S.chat.slice(0, -1).filter(m => m.content).slice(-12);
  while (history.length && history[0].role !== "user") history.shift();
  const input = [{ role: "user", content: COMPANION_RULES + financeSnapshot() }, ...history];
  const bubble = () => document.querySelector("#thread .msg.assistant:last-child");
  const opts = { signal: S.asking.signal, onText: ({ text }) => { reply.content = text; const b = bubble(); if (b) b.innerHTML = md(text); scrollThread(); } };
  if (S.sampleTools) opts.tools = [findTool]; else opts.cache = false;
  try {
    const { text, truncated } = await S.sample(input, opts);
    reply.content = text;
    if (truncated) reply.error = "The answer was cut short. Ask for less at a time.";
  } catch (e) {
    reply.content = e?.text || "";
    if (e?.code !== "cancelled") reply.error = AI_ERRORS[e?.code] || "Couldn't reach Claude. Check your connection and try again.";
    if (e?.code === "cancelled" && !reply.content) reply.error = "Stopped.";
  } finally {
    S.asking = null; render(true); scrollThread();
  }
}
function scrollThread() { const t = document.getElementById("thread"); if (t) t.scrollTop = t.scrollHeight; }

/* ---------- render ---------- */
let pendingRender = false;
function render(force) {
  const app = document.getElementById("app");
  const ae = document.activeElement;
  if (!force && ae && app.contains(ae) && (ae.matches("input:not([type=checkbox]),select"))) { pendingRender = true; return; }
  pendingRender = false;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  document.getElementById("monthLabel").textContent = monthName(thisMonth);
  renderChip();
  let notice = "";
  if (S.error) notice = `<div class="notice crit">${esc(S.error)}</div>`;
  else if (S.accounts.some(a => a.demo)) notice = `<div class="notice">These are <b>example numbers</b> so you can try the layout. Your real accounts replace them after the first bank sync.</div>`;
  if (!S.db && !S.error) { app.innerHTML = notice + `<div class="empty">Sign in to claude.ai to see the household numbers.</div>`; return; }
  if (!S.ready.accounts || !S.ready.txns) { app.innerHTML = `<div class="empty">Loading your household numbers…</div>`; return; }
  const v = { month: viewMonth, where: viewWhere, worth: viewWorth, bills: viewBills, ask: viewAsk }[S.tab] || viewMonth;
  app.innerHTML = notice + v();
}
function renderChip() {
  const c = document.getElementById("syncChip"), m = S.meta;
  let cls = "chip", txt;
  if (S.accounts.some(a => a.demo)) { cls += " demo"; txt = "Example data"; }
  else if (!m) { txt = S.db ? "Not synced yet" : "Offline"; }
  else if (m.status === "error") { cls += " crit"; txt = "Last sync failed"; c.title = m.message || ""; }
  else {
    const hrs = (Date.now() - new Date(m.at)) / 36e5;
    cls += hrs > 36 ? " warn" : " good";
    txt = hrs < 1 ? "Synced just now" : hrs < 24 ? `Synced ${Math.round(hrs)}h ago` : `Synced ${Math.round(hrs / 24)}d ago`;
    if (hrs > 36) txt += " · stale";
  }
  c.className = cls; c.innerHTML = `<i></i>${esc(txt)}`;
}

/* ---------- events ---------- */
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  S.tab = b.dataset.tab; try { localStorage.setItem("ps-tab", S.tab); } catch (err) {}
  render(true); window.scrollTo({ top: 0 });
});
const app = document.getElementById("app");
app.addEventListener("click", e => {
  const sug = e.target.closest("[data-suggest]"); if (sug) { ask(sug.dataset.suggest); return; }
  if (e.target.id === "askStop") { S.asking?.abort(); return; }
  if (e.target.id === "chatClear") { S.chat = []; render(true); return; }
  const go = e.target.closest("[data-goto]"); if (go) { S.tab = go.dataset.goto; render(true); return; }
  const m = e.target.closest("[data-month]"); if (m && S.tab === "where") { S.whereMonth = m.dataset.month; render(true); return; }
  const delA = e.target.closest("[data-del-acct]");
  if (delA) {
    if (delA.dataset.confirm) write(db => db.doc(`accounts/${delA.dataset.delAcct}`).delete(), "Account removed");
    else { delA.dataset.confirm = "1"; delA.textContent = "Confirm remove"; delA.style.color = "var(--crit)"; }
    return;
  }
  const del = e.target.closest("[data-del]");
  if (del) {
    if (del.dataset.confirm) write(db => db.doc(`bills/${del.dataset.del}`).delete(), "Bill removed");
    else { del.dataset.confirm = "1"; del.textContent = "Confirm remove"; del.style.color = "var(--crit)"; }
  }
});
app.addEventListener("input", e => {
  if (e.target.id === "askInput") { S.draft = e.target.value; return; }
  if (e.target.id === "txnSearch") { S.search = e.target.value; document.getElementById("txnList").innerHTML = txnTable(S.whereMonth || thisMonth); }
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "catFilter") { S.catFilter = t.value; document.getElementById("txnList").innerHTML = txnTable(S.whereMonth || thisMonth); return; }
  if (t.dataset.cat) {
    const v = parseFloat(t.value), id = slug(t.dataset.cat);
    write(db => isNaN(v) || v <= 0 ? db.doc(`budgets/${id}`).delete() : db.doc(`budgets/${id}`).set({ category: t.dataset.cat, limit: v }), "Budget saved");
  }
  if (t.dataset.txn) {
    const txn = S.txns.find(x => x.id === t.dataset.txn), cat = t.value;
    const key = String(txn?.payee || txn?.description || "").toUpperCase().replace(/[#*]\S*|\d+/g, " ").replace(/\s+/g, " ").trim().split(" ").slice(0, 3).join(" ");
    write(async db => {
      await db.doc(`transactions/${t.dataset.txn}`).update({ category: cat, categoryLocked: true });
      if (key.length >= 3 && !NOT_SPENDING.has(cat) && cat !== "Uncategorized") await db.doc(`rules/${slug(key)}`).set({ merchant: key, category: cat });
    }, key.length >= 3 && !NOT_SPENDING.has(cat) && cat !== "Uncategorized" ? `Saved. Future “${key}” charges go to ${cat}.` : "Category saved");
  }
  if (t.dataset.acct) {
    const v = t.value === "" ? null : parseFloat(t.value);
    write(db => db.doc(`accounts/${t.dataset.acct}`).update({ [t.dataset.field]: v }), "Saved");
  }
  if (t.dataset.manualBal) {
    const a = S.accounts.find(x => x.id === t.dataset.manualBal), v = Math.abs(parseFloat(t.value));
    if (!a || isNaN(v)) return;
    write(db => db.doc(`accounts/${a.id}`).update({ balance: LIAB_TYPES.has(a.type) ? -v : v, updatedAt: new Date().toISOString(), balanceDate: new Date().toISOString().slice(0, 10) }), "Balance updated");
  }
  if (t.dataset.paid) write(db => db.doc(`bills/${t.dataset.paid}`).update({ paidMonth: t.checked ? thisMonth : null }), t.checked ? "Marked paid" : "Marked unpaid");
});
app.addEventListener("submit", e => {
  if (e.target.id === "askForm") { e.preventDefault(); ask(document.getElementById("askInput").value); return; }
  if (e.target.id === "acctForm") {
    e.preventDefault();
    const name = document.getElementById("acctName").value.trim(), type = document.getElementById("acctType").value;
    const bal = Math.abs(parseFloat(document.getElementById("acctBal").value)), num = id => { const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? null : v; };
    if (!name || isNaN(bal)) return;
    const now = new Date().toISOString();
    const doc = { name, type, institution: "Added by hand", last4: "", manual: true, balance: LIAB_TYPES.has(type) ? -bal : bal,
      apr: num("acctApr"), payment: num("acctPay"), currency: "USD", balanceDate: now.slice(0, 10), updatedAt: now };
    write(async db => { await db.doc(`accounts/m_${slug(name).slice(0, 40)}-${Math.random().toString(36).slice(2, 6)}`).set(doc); e.target.reset(); }, `${name} added`);
    return;
  }
  if (e.target.id !== "billForm") return;
  e.preventDefault();
  const name = document.getElementById("billName").value.trim();
  const bill = { name, dueDay: Math.min(31, Math.max(1, parseInt(document.getElementById("billDay").value, 10))), amount: parseFloat(document.getElementById("billAmt").value) || 0,
    accountId: document.getElementById("billAcct").value || null, autopay: document.getElementById("billAuto").checked, paidMonth: null };
  if (!name) return;
  write(async db => { await db.collection("bills").add(bill); e.target.reset(); }, "Bill added");
});
app.addEventListener("keydown", e => {
  if (e.target.id === "askInput" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(e.target.value); }
});
app.addEventListener("focusout", () => setTimeout(() => { if (pendingRender) render(); }, 0));

const tip = document.getElementById("tip");
document.addEventListener("pointermove", e => {
  const el = e.target.closest?.("[data-tip]");
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = e.clientY - tip.offsetHeight - 12;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = (y < 8 ? e.clientY + 18 : y) + "px";
});

/* ---------- data ---------- */
async function start() {
  render(true);
  window.claude?.use?.("sample").then(async fn => {
    S.sample = fn;
    if (fn) S.sampleTools = !!(await fn.limits().catch(() => null))?.tools;
    if (S.tab === "ask") render();
  });
  const db = await window.claude?.use?.("db");
  if (!db) { render(true); return; }
  S.db = db;
  try { const user = await window.claude.use("user"); const w = user?.can?.("data.write"); if (w === false) S.canWrite = false; } catch (e) {}
  const docs = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const fail = e => { S.error = e?.code === "not_granted" ? "This page needs database access. Allow it from the artifact's Permissions menu." : "Lost connection to the household data. Reload the page to try again."; render(true); };
  const cutoff = `${lastMonths(7)[0]}-01`;
  db.collection("accounts").onSnapshot(s => { S.accounts = docs(s).sort((a, b) => (a.institution + a.name).localeCompare(b.institution + b.name)); S.ready.accounts = true; render(); }, fail);
  db.collection("transactions").where("date", ">=", cutoff).orderBy("date", "desc").limit(1000).onSnapshot(s => { S.txns = docs(s); S.ready.txns = true; render(); }, fail);
  db.collection("balances").orderBy("date", "desc").limit(400).onSnapshot(s => { S.balances = docs(s); render(); }, fail);
  db.collection("budgets").onSnapshot(s => { S.budgets = docs(s); render(); }, fail);
  db.collection("bills").onSnapshot(s => { S.bills = docs(s); render(); }, fail);
  db.doc("meta/sync").onSnapshot(s => { S.meta = s.exists ? s.data() : null; render(); }, () => {});
}
start();
</script>
