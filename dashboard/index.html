<style>
/* Layout: household ledger. Sticky header + tab rail, summary figures first, detail below in one column that widens to two on desktop. */

  --crit: #c23838;

  --s-out: #6a5fd0;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #18201c; --ink: #e8efeb; --ink-2: #b3c0b9; --muted: #84928b;
    --line: #29332e; --accent: #5cc29e; --accent-soft: #1d3a30; --bar-rest: #2f6553;
    --good: #4cbf5a; --warn: #f0b429; --warn-fill: #f0b429; --crit: #ec6a66; --s-in: #3fa982; --s-out: #8f86e6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #18201c; --ink: #e8efeb; --ink-2: #b3c0b9; --muted: #84928b;
  --line: #29332e; --accent: #5cc29e; --accent-soft: #1d3a30; --bar-rest: #2f6553;
  --good: #4cbf5a; --warn: #f0b429; --warn-fill: #f0b429; --crit: #ec6a66; --s-in: #3fa982; --s-out: #8f86e6; color-scheme: dark;
}
/* Get In Tune side: her brand from getintunemusictherapy.com. Deep indigo #352c73 / #4a439e, periwinkle #6a6db0,
   violet #a12db5, lavender ground #f7f6fb; Oswald headings and Assistant text, as on her site. */
body[data-space="biz"] { --bg: #f7f6fb; --ink: #1d1838; --accent: #4a439e; --accent-soft: #e9e8f6; --bar-rest: #b4b6dd; --line: #e2e0ef;
  --s-in: #4a439e; --s-out: #a12db5; --font-display: "Oswald", "Arial Narrow", "Avenir Next Condensed", sans-serif; --font-body: "Assistant", "Segoe UI", system-ui, sans-serif; }
/* Her logo (from her site, embedded) replaces the typed name on the Get In Tune side. */
.space-pick #bizLogo { display: none; height: 56px; width: auto; max-width: 62vw; }
body[data-space="biz"] .space-pick #bizLogo { display: block; }
body[data-space="biz"] .space-pick #spaceName { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
@media (max-width: 480px) { .space-pick #bizLogo { height: 48px; } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .space-pick #bizLogo { background: #f7f6fb; border-radius: 8px; padding: 3px 8px; } }
:root[data-theme="dark"] .space-pick #bizLogo { background: #f7f6fb; border-radius: 8px; padding: 3px 8px; }
body[data-space="biz"] .space-pick #spaceName { text-transform: uppercase; letter-spacing: .04em; font-weight: 600; color: #352c73; }
body[data-space="biz"] .top { border-bottom: 2px solid transparent; border-image: linear-gradient(90deg, var(--accent), var(--s-out)) 1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-space="biz"] { --bg: #110f20; --surface: #1a172e; --ink: #ecebf8; --accent: #a9abe8; --accent-soft: #28244a; --bar-rest: #4b4d8c; --line: #2c2849; --s-in: #a9abe8; --s-out: #d27ee0; }
  :root:not([data-theme="light"]) body[data-space="biz"] .space-pick #spaceName { color: #d9d8f5; } }
:root[data-theme="dark"] body[data-space="biz"] { --bg: #110f20; --surface: #1a172e; --ink: #ecebf8; --accent: #a9abe8; --accent-soft: #28244a; --bar-rest: #4b4d8c; --line: #2c2849; --s-in: #a9abe8; --s-out: #d27ee0; }
:root[data-theme="dark"] body[data-space="biz"] .space-pick #spaceName { color: #d9d8f5; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); font-variant-numeric: tabular-nums; }

button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 14px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; flex: 1 1 auto; min-width: 0; }

.brand { flex-wrap: wrap; row-gap: 0; }

.space-pick { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 0 6px; margin-left: -6px; border-radius: 8px; }

.space-pick:hover, .space-pick:focus-within { background: var(--accent-soft); }
.space-pick:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.space-pick select { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; font: 16px var(--font-body); }
.brand #monthLabel { color: var(--muted); font-size: .85rem; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.chip.good { color: var(--good); } .chip.warn { color: var(--warn); } .chip.crit { color: var(--crit); }
.chip.demo { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; width: 100%; scrollbar-width: none; }

nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:hover { color: var(--ink); }

main.wrap { padding-block: 20px 48px; display: grid; gap: 20px; }
.notice { padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); color: var(--ink); font-size: .9rem; }
.notice.warn-notice { background: color-mix(in srgb, var(--warn-fill) 18%, var(--surface)); }
.notice.crit { background: color-mix(in srgb, var(--crit) 14%, var(--surface)); }

.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.fig { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.fig .label { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.fig .value { font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; line-height: 1.2; margin-top: 2px; }

.cols { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }

section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; display: grid; gap: 14px; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel-head p { margin: 0; color: var(--muted); font-size: .85rem; }

.budget-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.budget-row .name { font-weight: 600; }

.track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.track b { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }

.status { font-size: .75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-good { color: var(--good); } .s-warn { color: var(--warn); } .s-crit { color: var(--crit); }
.fill-good { background: var(--good); } .fill-warn { background: var(--warn-fill); } .fill-crit { background: var(--crit); }
.limit-input { width: 88px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); text-align: right; }

.hbar { display: grid; grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .9rem; }

.hbar .amt { text-align: right; color: var(--ink-2); min-width: 72px; }
.hbar .cat { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; white-space: nowrap; }
.scroll { overflow-x: auto; }
.payee { font-weight: 500; }
.payee small { display: block; color: var(--muted); font-weight: 400; }
.pos { color: var(--good); }
.neg { color: var(--crit); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.privacy { margin: 0; font-size: .82rem; color: var(--muted); }

.pill.muted { background: var(--line); color: var(--ink-2); }
select.cat-select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 2px 4px; max-width: 150px; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.controls input, .controls select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-width: 0; }
.controls input[type="search"] { flex: 1 1 200px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.link { border: 0; background: none; color: var(--muted); padding: 2px 6px; font-weight: 500; }
.btn.link:hover { color: var(--crit); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }

svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font: 13px var(--font-body); font-variant-numeric: tabular-nums; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .hit { fill: transparent; cursor: default; }

.acct-group { display: grid; gap: 4px; }
.acct-group h3 { font-size: .8rem; font-family: var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 6px; }
.acct { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.acct .meta { color: var(--muted); font-size: .82rem; }
.acct .bal { font-weight: 600; text-align: right; }
.acct .edit { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--ink-2); align-items: center; }
.acct .edit input { width: 84px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.util { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.util b { display: block; height: 100%; border-radius: 3px; }

.bill { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.bill .date { width: 52px; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; line-height: 1.1; }
.bill .date b { display: block; font-family: var(--font-display); font-size: 1.3rem; }
.bill .date span { font-size: .7rem; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
.bill.paid { opacity: .55; }
.bill .right { text-align: right; display: grid; gap: 2px; justify-items: end; }
.bill label { font-size: .82rem; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
form.add { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); align-items: end; }
form.add label { display: grid; gap: 2px; font-size: .78rem; color: var(--muted); }
form.add input, form.add select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 8px; width: 100%; }

.ask { gap: 12px; }
.thread { display: grid; gap: 12px; max-height: min(60vh, 560px); overflow-y: auto; padding-right: 4px; }
.thread .intro { color: var(--ink-2); margin: 0; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.55; overflow-wrap: anywhere; }
.msg.user { justify-self: end; background: var(--accent); color: var(--bg); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.assistant { justify-self: start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
.msg ul, .msg ol { margin: 4px 0 8px; padding-left: 20px; }
.msg-err { color: var(--crit); font-size: .85rem; }
.thinking { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .thinking { animation: pulse 1.4s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .4; } } }
.proposals { display: grid; gap: 6px; margin-top: 10px; }
.proposal { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: .9rem; }
.proposal.pending { border-color: var(--accent); }
.proposal.dismissed { opacity: .6; }
.proposal-btns { display: inline-flex; gap: 6px; }
.proposal-btns .btn { padding: 3px 10px; }
.proposal-state { color: var(--muted); font-size: .82rem; font-weight: 600; }
.proposal.applied .proposal-state { color: var(--good); } .proposal.failed .proposal-state { color: var(--crit); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .85rem; text-align: left; }
.chip-btn:hover { border-color: var(--accent); }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1 1 auto; min-width: 0; resize: vertical; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; font: inherit; }
@media (max-width: 520px) { .msg { max-width: 100%; } }
.add-acct { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; }
.add-acct summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.add-acct[open] { display: grid; gap: 8px; }
.add-acct .meta { margin: 0; color: var(--muted); font-size: .85rem; }
.clickable { cursor: pointer; border-radius: 6px; }
.clickable:hover { background: var(--accent-soft); }
.budget-row.clickable { padding: 4px 6px; margin: -4px -6px; }
.sheet-backdrop { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--ink) 45%, transparent); }
.sheet { position: fixed; z-index: 41; left: 50%; top: calc(24px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(680px, calc(100% - 32px)); max-height: calc(100% - 48px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 16px; align-content: start; box-shadow: 0 12px 40px color-mix(in srgb, var(--ink) 25%, transparent); }
.sheet .figures { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.sheet .fig { padding: 10px 12px; }
.sheet .fig .value { font-size: 1.3rem; }
.sheet .fig .label { font-size: .68rem; }
.row-note { grid-column: 1 / -1; font-size: .78rem; color: var(--muted); }
.breakdown { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: .92rem; }
.breakdown > div { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.breakdown small { color: var(--muted); margin-left: 6px; }
.breakdown .total { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; }
.breakdown .pending-note { margin: 4px 0 0; font-size: .8rem; color: var(--ink-2); }
.pill.pending { background: color-mix(in srgb, var(--warn-fill) 22%, var(--surface)); color: var(--warn); }
.pill.refund { background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good); }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet-head p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
.sheet-sub { font-size: .8rem; font-family: var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
@media (max-width: 560px) { .sheet { top: auto; bottom: 0; left: 0; transform: none; width: 100%; max-height: 88%; border-radius: 16px 16px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); } }
.empty { color: var(--muted); padding: 24px 8px; text-align: center; }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: .8rem; max-width: 240px; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: .85rem; z-index: 30; }
@media (prefers-reduced-motion: no-preference) { .track b, .hbar .bar, .util b { transition: width .3s ease; } }
</style>

<script>
const CATEGORIES = ["Groceries","Dining","Shopping","Gas","Transportation","Utilities","Subscriptions","Insurance","Health","Home","Kids","Travel","Entertainment","Games","Gifts","Fees","Income","Transfer","Uncategorized"];
const NOT_SPENDING = new Set(["Income","Transfer"]);
// txns = household only; allTxns = every account (last 7 months); bizTxns = business accounts since January 1.
const SPACES = {
  home: { title: "Patterson Spending", tabs: [["month", "This Month"], ["where", "Where It Goes"], ["worth", "Net Worth & Debt"], ["bills", "Bills"], ["ask", "Ask"]] },
  biz: { title: "Get In Tune", sub: "Therapy & coaching for life's big changes", tabs: [["biz:overview", "Overview"], ["biz:invoices", "Invoices"], ["biz:mileage", "Mileage"], ["biz:taxes", "Taxes"], ["biz:setup", "Setup"], ["ask", "Ask"]] },
};
const S = { space: "home", lastTab: { home: "month", biz: "biz:overview" }, chatBy: { home: [], biz: [] }, tab: "month", questions: [], me: null, accounts: [], txns: [], allTxns: [], bizTxns: [], balances: [], budgets: [], bills: [], meta: null, db: null, canWrite: true,
  invoices: [], mileage: [], taxPayments: [], bizMeta: null, bizSub: "overview", bizSearch: "", bizTodo: false,
  ready: { accounts: false, txns: false }, sample: undefined, sampleTools: false, chat: [], draft: "", asking: null, whereMonth: null, search: "", catFilter: "", error: null };

const usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const usd0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "x";
const pad = n => String(n).padStart(2, "0");
const ym = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const today = new Date();
const thisMonth = ym(today);
const monthName = (key, style = "long") => new Date(+key.slice(0, 4), +key.slice(5, 7) - 1, 1).toLocaleString("en-US", { month: style, year: style === "long" ? "numeric" : undefined });
const lastMonths = n => Array.from({ length: n }, (_, i) => ym(new Date(today.getFullYear(), today.getMonth() - (n - 1 - i), 1)));
const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();

try { const sp = localStorage.getItem("ps-space"); if (SPACES[sp]) S.space = sp; const lt = JSON.parse(localStorage.getItem("ps-lasttab") || "null"); if (lt) Object.assign(S.lastTab, lt); } catch (e) {}
if (/^#(biz|getintune)$/.test(location.hash)) S.space = "biz";
else if (/^#(month|where|worth|bills)$/.test(location.hash)) { S.space = "home"; S.lastTab.home = location.hash.slice(1); }
function setTab(key) { // "month" | "ask" | "biz:invoices" ...
  S.lastTab[S.space] = key;
  if (key.startsWith("biz:")) { S.tab = "biz"; S.bizSub = key.slice(4); } else S.tab = key;
  try { localStorage.setItem("ps-lasttab", JSON.stringify(S.lastTab)); } catch (e) {}
}
function setSpace(sp) {
  S.chatBy[S.space] = S.chat; S.space = sp; S.chat = S.chatBy[sp]; S.draft = ""; S.detail = null; document.body.style.overflow = "";
  try { localStorage.setItem("ps-space", sp); } catch (e) {}
  setTab(S.lastTab[sp]);
}
const tabKey = () => S.tab === "biz" ? `biz:${S.bizSub}` : S.tab;
function renderTabs() {
  const sp = SPACES[S.space], nav = document.querySelector("nav.tabs"), key = tabKey();
  document.body.dataset.space = S.space;
  const sel = document.getElementById("spaceSel"); if (sel.value !== S.space) sel.value = S.space;
  document.getElementById("spaceName").textContent = sp.title;
  const html = sp.tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${k === key}">${esc(l)}</button>`).join("");
  if (nav.dataset.sig !== S.space + key) { nav.innerHTML = html; nav.dataset.sig = S.space + key; }
}

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
async function write(fn, okMsg) {
  if (!S.db) return toast("Sign in to claude.ai to make changes.");
  try { await fn(S.db); if (okMsg) toast(okMsg); }
  catch (e) { toast(e?.code === "not_granted" ? "You have view-only access. Ask the owner for Contributor access." : "Couldn't save. Check your connection and try again."); }
}

/* ---------- derived numbers ---------- */
const merchantKey = txn => String(txn?.payee || txn?.description || "").toUpperCase().replace(/[#*]\S*|\d+/g, " ").replace(/\s+/g, " ").trim().split(" ").slice(0, 3).join(" ");
const isSpend = t => !NOT_SPENDING.has(t.category);
// Charges, refunds and pending for one category in a set of rows (amounts negative = money out).
function catMath(rows) {
  const m = { charges: 0, nCharges: 0, refunds: 0, nRefunds: 0, pending: 0, nPending: 0 };
  for (const t of rows) {
    if (t.amount < 0) { m.charges -= t.amount; m.nCharges++; } else if (t.amount > 0) { m.refunds += t.amount; m.nRefunds++; }
    if (t.pending) { m.pending += Math.abs(t.amount); m.nPending++; }
  }
  return m;
}
// Banks whose synced accounts all have an old balance date: the bank connection has stalled.
function staleBanks() {
  const by = new Map();
  for (const a of S.accounts) if (!a.manual && !a.demo && a.balanceDate) {
    const b = by.get(a.institution) || { name: a.institution, since: a.balanceDate };
    if (a.balanceDate > b.since) b.since = a.balanceDate;
    by.set(a.institution, b);
  }
  return [...by.values()].filter(b => daysBetween(b.since, todayKey) >= 2).sort((x, y) => x.since < y.since ? -1 : 1);
}
function spendByCat(month) {
  const m = new Map();
  for (const t of S.txns) if (t.date?.startsWith(month) && isSpend(t)) m.set(t.category, (m.get(t.category) || 0) - t.amount);
  return m;
}
const total = m => [...m.values()].reduce((a, b) => a + b, 0);
const incomeFor = month => S.txns.filter(t => t.date?.startsWith(month) && t.category === "Income").reduce((a, t) => a + t.amount, 0);
const isAsset = a => a.type === "checking" || a.type === "savings";
const isLiability = a => a.type === "credit" || a.type === "loan";
function nextDue(bill) {
  const midnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const on = offset => { const f = new Date(today.getFullYear(), today.getMonth() + offset, 1);
    const dim = new Date(f.getFullYear(), f.getMonth() + 1, 0).getDate();
    return new Date(f.getFullYear(), f.getMonth(), Math.min(bill.dueDay || 1, dim)); };
  const date = bill.paidMonth === thisMonth ? on(1) : on(0);
  const days = Math.round((date - midnight) / 864e5);
  return { date, days, overdue: days < 0 };
}
function budgetStatus(spent, limit) {
  if (!limit) return null;
  const r = spent / limit;
  if (r > 1) return ["crit", "Over"];
  if (r >= 0.85 || r > (today.getDate() / daysInMonth) + 0.15) return ["warn", "Ahead of pace"];
  return ["good", "On track"];
}

/* ---------- charts ---------- */
function niceTicks(max, count = 4) {
  if (max <= 0) return [0, 1];
  const raw = max / count, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s >= raw);
  const ticks = []; for (let v = 0; v <= max + step * 0.001; v += step) ticks.push(v);
  if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
  return ticks;
}
const short = v => { const a = Math.abs(v), sign = v < 0 ? "-" : "";
  return sign + (a >= 1e6 ? `$${(a / 1e6).toFixed(1)}M` : a >= 1e3 ? `$${(a / 1e3).toFixed(a >= 1e4 ? 0 : 1)}k` : `$${Math.round(a)}`); };

function monthBars(months, values, current) {
  const W = 480, H = 200, L = 50, B = 24, T = 10, R = 8;
  const ticks = niceTicks(Math.max(...values, 1)), top = ticks[ticks.length - 1];
  const y = v => T + (H - T - B) * (1 - v / top), slot = (W - L - R) / months.length, bw = Math.min(44, slot * 0.6);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending by month">`;
  for (const t of ticks) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${short(t)}</text>`;
  months.forEach((m, i) => {
    const x = L + slot * i + (slot - bw) / 2, h = Math.max(0, y(0) - y(values[i])), r = Math.min(4, h);
    const fill = m === current ? "var(--accent)" : "var(--bar-rest)";
    if (h > 0) s += `<path d="M${x},${y(0)} v${-(h - r)} q0,${-r} ${r},${-r} h${bw - 2 * r} q${r},0 ${r},${r} v${h - r} z" fill="${fill}"/>`;
    s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" style="${m === current ? "fill:var(--ink);font-weight:600" : ""}">${monthName(m, "short")}</text>`;
    s += `<rect class="hit" x="${L + slot * i}" y="${T}" width="${slot}" height="${H - T - B}" data-tip="${esc(monthName(m))}: ${esc(usd0.format(values[i]))} spent" data-month="${m}"/>`;
  });
  return s + `</svg>`;
}

function lineChart(points) {
  const W = 480, H = 210, L = 56, B = 24, T = 12, R = 14;
  if (points.length < 2) return `<p class="empty">The trend line appears after two days of syncs.</p>`;
  const vals = points.map(p => p.v); let lo = Math.min(...vals), hi = Math.max(...vals);
  const padv = (hi - lo) * 0.15 || Math.abs(hi) * 0.05 || 100; lo -= padv; hi += padv;
  const t0 = +new Date(points[0].d), t1 = +new Date(points[points.length - 1].d);
  const x = d => L + (W - L - R) * ((+new Date(d) - t0) / (t1 - t0 || 1)), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const step = (hi - lo) / 4;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net worth over time">`;
  for (let i = 0; i <= 4; i++) { const v = lo + step * i; s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`; }
  if (lo < 0 && hi > 0) s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink-2)" stroke-dasharray="3 3"/>`;
  const line = points.map((p, i) => `${i ? "L" : "M"}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  s += `<path d="${line} L${x(points[points.length - 1].d)},${H - B} L${L},${H - B} Z" fill="var(--accent)" fill-opacity=".12"/>`;
  s += `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  const last = points[points.length - 1];
  s += `<circle cx="${x(last.d)}" cy="${y(last.v)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  const fmt = d => new Date(d + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
  s += `<text x="${L}" y="${H - 6}">${fmt(points[0].d)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmt(last.d)}</text>`;
  const seg = (W - L - R) / points.length;
  points.forEach(p => s += `<rect class="hit" x="${x(p.d) - Math.max(seg, 6) / 2}" y="${T}" width="${Math.max(seg, 6)}" height="${H - T - B}" data-tip="${esc(fmt(p.d))}: ${esc(usd0.format(p.v))}"/>`);
  return s + `</svg>`;
}

function payoff(balance, aprPct, payment) {
  const B = Math.abs(balance), r = (+aprPct || 0) / 1200, P = +payment || 0;
  if (!B || !P) return null;
  if (r === 0) return { months: Math.ceil(B / P), interest: 0 };
  if (P <= B * r) return { never: true };
  const n = Math.ceil(-Math.log(1 - (r * B) / P) / Math.log(1 + r));
  return { months: n, interest: Math.max(0, P * n - B) };
}

const bizKind = t => BIZ_INCOME.includes(t.category) ? "income" : BIZ_EXPENSE.includes(t.category) ? "expense"
  : t.category === "Tax Payment" ? "tax" : ["Owner Draw", "Owner Contribution", "Transfer"].includes(t.category) ? "owner" : "todo";
const lineOf = t => t.serviceLine || (bizKind(t) === "income" ? biz().defaultLine : SHARED);
const addDays = (key, n) => { const d = new Date(key + "T12:00"); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);
const fmtDay = k => k ? new Date(k + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "—";
const dueOf = i => i.due || addDays(i.issued || todayKey, 30);
const agingOf = i => { const late = daysBetween(dueOf(i), todayKey); return late <= 0 ? 0 : late <= 30 ? 1 : late <= 60 ? 2 : late <= 90 ? 3 : 4; };
const sumBy = (list, f) => list.reduce((a, x) => a + (+f(x) || 0), 0);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const lineOpts = (sel, shared) => [...biz().serviceLines, ...(shared ? [SHARED] : [])].map(l => `<option ${l === sel ? "selected" : ""}>${esc(l)}</option>`).join("");

function pnl(from, to) { // inclusive date keys; cash basis, mileage counted as an expense
  const r = { income: 0, expense: 0, mileage: 0, todo: 0, todoN: 0, byCat: new Map(), byLine: new Map() };
  const line = k => { if (!r.byLine.has(k)) r.byLine.set(k, { income: 0, expense: 0 }); return r.byLine.get(k); };
  for (const t of S.bizTxns) {
    if (!t.date || t.date < from || t.date > to) continue;
    const k = bizKind(t);
    if (k === "income") { r.income += t.amount; line(lineOf(t)).income += t.amount; }
    else if (k === "expense") { r.expense -= t.amount; line(lineOf(t)).expense -= t.amount; r.byCat.set(t.category, (r.byCat.get(t.category) || 0) - t.amount); }
    else if (k === "todo") { r.todo += t.amount; r.todoN++; }
  }
  const rate = +biz().mileageRate || 0;
  for (const m of S.mileage) if (m.date >= from && m.date <= to) {
    const v = (+m.miles || 0) * rate; r.mileage += v; line(m.serviceLine || biz().defaultLine).expense += v;
  }
  if (r.mileage) r.byCat.set("Mileage", r.mileage);
  r.net = r.income - r.expense - r.mileage;
  return r;
}
function taxOn(net) { // self-employment tax plus her combined federal + state rate, after the half-SE deduction
  const n = Math.max(0, net), se = n * 0.9235 * 0.153;
  const inc = Math.max(0, n - se / 2) * (+biz().incomeTaxRate || 0) / 100;
  return { se, inc, total: se + inc };
}
function taxPaidByQuarter() {
  const paid = [0, 0, 0, 0, 0];
  for (const t of S.bizTxns) if (t.category === "Tax Payment" && t.date > `${year}-01-15`) // early January pays last year's Q4
    paid[QUARTERS.find(x => t.date <= x.due)?.q || 4] -= t.amount;
  for (const p of S.taxPayments) if (+p.year === year) paid[+p.quarter || 4] += +p.amount || 0;
  return paid;
}
function taxQuarters() {
  const paid = taxPaidByQuarter(); let paidSoFar = 0;
  return QUARTERS.map(q => {
    const started = q.start <= todayKey;
    const owed = started ? taxOn(pnl(yearStart, q.end < todayKey ? q.end : todayKey).net).total : 0;
    paidSoFar += paid[q.q];
    return { ...q, started, owed, paid: paid[q.q], paidSoFar, short: Math.max(0, owed - paidSoFar), days: daysBetween(todayKey, q.due) };
  });
}

function pairBars(months, a, b) {
  const W = 480, H = 200, L = 50, B = 24, T = 10, R = 8;
  const ticks = niceTicks(Math.max(...a, ...b, 1)), top = ticks[ticks.length - 1];
  const y = v => T + (H - T - B) * (1 - v / top), slot = (W - L - R) / months.length, bw = Math.min(18, slot * 0.34);
  const bar = (x, v, fill) => { const h = Math.max(0, y(0) - y(Math.max(0, v))), r = Math.min(4, h, bw / 2);
    return h > 0 ? `<path d="M${x},${y(0)} v${-(h - r)} q0,${-r} ${r},${-r} h${bw - 2 * r} q${r},0 ${r},${r} v${h - r} z" fill="${fill}"/>` : ""; };
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Business income and expenses by month">`;
  for (const t of ticks) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${short(t)}</text>`;
  months.forEach((m, i) => {
    const cx = L + slot * i + slot / 2;
    s += bar(cx - bw - 1, a[i], "var(--s-in)") + bar(cx + 1, b[i], "var(--s-out)");
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle" style="${m === thisMonth ? "fill:var(--ink);font-weight:600" : ""}">${monthName(m, "short")}</text>`;
    s += `<rect class="hit" x="${L + slot * i}" y="${T}" width="${slot}" height="${H - T - B}" data-tip="${esc(monthName(m))}: ${esc(usd0.format(a[i]))} in, ${esc(usd0.format(b[i]))} out, ${esc(usd0.format(a[i] - b[i]))} profit"/>`;
  });
  return s + `</svg>`;
}

function bizTable() {

  }).join("")}</tbody></table>${more}`;
}

function viewTaxes() {
  const ytd = pnl(yearStart, todayKey), tax = taxOn(ytd.net), qs = taxQuarters();
  const paidYear = qs.reduce((a, q) => a + q.paid, 0), perDollar = taxOn(1000).total / 1000;
  const next = qs.find(q => q.days >= 0);
  const status = q => {
    if (!q.started) return `<span style="color:var(--muted)">Not started</span>`;
    if (q.short < 1) return `<span class="status s-good" style="margin:0">Covered</span>`;
    if (q.days < 0) return `<span class="status s-crit" style="margin:0">Short ${usd0.format(q.short)}</span>`;
    if (q.days <= 14) return `<span class="status s-warn" style="margin:0">Pay ${usd0.format(q.short)} by ${fmtDay(q.due)}</span>`;
    return `About ${usd0.format(q.short)} so far`;
  };
  const manual = S.taxPayments.filter(p => +p.year === year).sort((a, b) => a.date < b.date ? 1 : -1);
  return `
  <div class="figures">
    <div class="fig"><div class="label">Profit this year</div><div class="value">${usd0.format(ytd.net)}</div><div class="sub">after expenses and mileage</div></div>
    <div class="fig"><div class="label">Estimated tax so far</div><div class="value">${usd0.format(tax.total)}</div><div class="sub">${usd0.format(tax.se)} self-employment · ${usd0.format(tax.inc)} income</div></div>
    <div class="fig"><div class="label">Paid this year</div><div class="value">${usd0.format(paidYear)}</div><div class="sub">${tax.total - paidYear > 0 ? `${usd0.format(tax.total - paidYear)} still to pay` : "Caught up"}</div></div>
    <div class="fig"><div class="label">Set aside</div><div class="value">${Math.round(perDollar * 100)}%</div><div class="sub">of each dollar of profit${next ? ` · next due ${fmtDay(next.due)}` : ""}</div></div>
  </div>

  for (const b of S.budgets.filter(b => !cats.includes(b.category))) lines.push(`(budget with no spending yet: ${b.category} ${b.limit})`);
  lines.push("", "BILLS:");
  for (const b of S.bills) lines.push(`- ${b.name}: ${usd.format(+b.amount || 0)} due day ${b.dueDay}${b.autopay ? ", autopay" : ""}${b.paidMonth === thisMonth ? ", paid this month" : ""}`);

const findByName = (list, name, what) => {
  const q = String(name || "").trim().toLowerCase();
  const hits = list.filter(x => x.name?.toLowerCase() === q);
  const loose = hits.length ? hits : list.filter(x => x.name?.toLowerCase().includes(q) || (x.last4 && q.includes(x.last4)));
  if (loose.length === 1) return loose[0];
  const names = list.map(x => x.name + (x.last4 ? ` (${x.last4})` : "")).slice(0, 40).join("; ");
  throw new Error(loose.length ? `"${name}" matches several ${what}: ${loose.map(x => x.name + (x.last4 ? ` (${x.last4})` : "")).join("; ")}. Ask which one.` : `No ${what} named "${name}". Known ${what}: ${names || "none"}.`);

      } },

}

  if (t.dataset.bizcat !== undefined && t.value) {
    const txn = S.bizTxns.find(x => x.id === t.dataset.bizcat), cat = t.value, key = merchantKey(txn);
    const learn = key.length >= 3 && cat !== "Uncategorized" && cat !== "Transfer";
    write(async db => {
      await db.doc(`transactions/${t.dataset.bizcat}`).update({ category: cat, categoryLocked: true });
      if (learn) await db.doc(`rules/biz-${slug(key)}`).set({ merchant: key, category: cat, scope: "business" });
    }, learn ? `Saved. Future “${key}” business charges go to ${cat}.` : "Category saved");
  }
  if (t.dataset.line) write(db => db.doc(`transactions/${t.dataset.line}`).update({ serviceLine: t.value }), "Service saved");
  if (t.dataset.bizacct) write(db => db.doc(`accounts/${t.dataset.bizacct}`).update({ business: t.checked }), t.checked ? "Marked as business" : "Moved back to household");
  if (t.dataset.bizset) {
    const f = t.dataset.bizset, v = f === "defaultLine" ? t.value : parseFloat(t.value);
    if (f === "defaultLine" || (!isNaN(v) && v >= 0)) writeBiz({ [f]: v }, "Saved");
  }
  if (t.dataset.manualBal) {
    const a = S.accounts.find(x => x.id === t.dataset.manualBal), v = Math.abs(parseFloat(t.value));
    if (!a || isNaN(v)) return;
    write(db => db.doc(`accounts/${a.id}`).update({ balance: LIAB_TYPES.has(a.type) ? -v : v, updatedAt: new Date().toISOString(), balanceDate: new Date().toISOString().slice(0, 10) }), "Balance updated");
  }
  if (t.dataset.paid) write(db => db.doc(`bills/${t.dataset.paid}`).update({ paidMonth: t.checked ? thisMonth : null }), t.checked ? "Marked paid" : "Marked unpaid");
});
const val = id => document.getElementById(id).value;
function writeBiz(patch, msg) {
  write(db => S.bizMeta ? db.doc("meta/business").update(patch) : db.doc("meta/business").set({ ...BIZ_DEFAULTS, ...patch }), msg);
}
app.addEventListener("submit", e => {
  const f = e.target;
  if (f.id === "queueForm") { e.preventDefault(); sendQueued(document.getElementById("askInput").value); return; }
  if (f.id === "askForm") { e.preventDefault(); ask(document.getElementById("askInput").value); return; }
  if (f.id === "invForm") {
    e.preventDefault();
    const inv = { client: val("invClient").trim(), kind: val("invKind"), serviceLine: val("invLine"), amount: parseFloat(val("invAmt")) || 0,
      issued: val("invIssued"), due: val("invDue") || null, note: val("invNote").trim(), paidDate: null };
    if (inv.client) write(async db => { await db.collection("invoices").add(inv); f.reset(); }, "Invoice added");
    return;
  }
  if (f.id === "tripForm") {
    e.preventDefault();
    const miles = (parseFloat(val("tripMiles")) || 0) * (document.getElementById("tripRound").checked ? 2 : 1);
    const trip = { date: val("tripDate"), miles: Math.round(miles * 10) / 10, purpose: val("tripPurpose").trim(), serviceLine: val("tripLine") };
    if (trip.purpose && miles > 0) write(async db => { await db.collection("mileage").add(trip); f.reset(); }, `Logged ${trip.miles} miles`);
    return;
  }
  if (f.id === "taxForm") {
    e.preventDefault();
    const pay = { year, quarter: +val("taxQ"), amount: parseFloat(val("taxAmt")) || 0, date: val("taxDate") };
    if (pay.amount > 0) write(async db => { await db.collection("taxPayments").add(pay); f.reset(); }, "Payment logged");
    return;
  }
  if (f.id === "lineForm") {
    e.preventDefault();
    const name = val("lineName").trim().slice(0, 40), lines = biz().serviceLines;
    if (name && name !== SHARED && !lines.includes(name)) writeBiz({ serviceLines: [...lines, name] }, `Added ${name}`);
    return;
  }
  if (e.target.id === "acctForm") {
    e.preventDefault();
    const name = document.getElementById("acctName").value.trim(), type = document.getElementById("acctType").value;
    const bal = Math.abs(parseFloat(document.getElementById("acctBal").value)), num = id => { const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? null : v; };
    if (!name || isNaN(bal)) return;
    const now = new Date().toISOString();
    const doc = { name, type, institution: "Added by hand", last4: "", manual: true, balance: LIAB_TYPES.has(type) ? -bal : bal,
      apr: num("acctApr"), payment: num("acctPay"), currency: "USD", balanceDate: now.slice(0, 10), updatedAt: now };
    write(async db => { await db.doc(`accounts/m_${slug(name).slice(0, 40)}-${Math.random().toString(36).slice(2, 6)}`).set(doc); e.target.reset(); }, `${name} added`);
    return;
  }
  if (f.id !== "billForm") return;
  e.preventDefault();
  const name = document.getElementById("billName").value.trim();
  const bill = { name, dueDay: Math.min(31, Math.max(1, parseInt(document.getElementById("billDay").value, 10))), amount: parseFloat(document.getElementById("billAmt").value) || 0,
    accountId: document.getElementById("billAcct").value || null, autopay: document.getElementById("billAuto").checked, paidMonth: null };
  if (!name) return;
  write(async db => { await db.collection("bills").add(bill); e.target.reset(); }, "Bill added");
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.detail) closeDetail(); });
app.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.("[data-detail]")) { e.preventDefault(); openDetail(e.target); return; }
  if (e.target.id === "askInput" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (document.getElementById("queueForm")) sendQueued(e.target.value); else ask(e.target.value); }
});
app.addEventListener("focusout", () => setTimeout(() => { if (pendingRender) render(); }, 0));

const tip = document.getElementById("tip");
document.addEventListener("pointermove", e => {
  const el = e.target.closest?.("[data-tip]");
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = e.clientY - tip.offsetHeight - 12;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = (y < 8 ? e.clientY + 18 : y) + "px";
});

/* ---------- data ---------- */
const docs = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
const fail = e => { S.error = e?.code === "not_granted" ? "This page needs database access. Allow it from the artifact's Permissions menu." : "Lost connection to the household data. Reload the page to try again."; render(true); };
function splitTxns() { const ids = new Set(bizIds()); S.txns = S.allTxns.filter(t => !ids.has(t.accountId)); }
let bizKey = null, bizUnsub = null;
function watchBiz() { // business accounts get their own query so profit and taxes cover the whole year
  const ids = bizIds().slice(0, 30), key = ids.join(",");
  if (key === bizKey) return;
  bizKey = key; if (typeof bizUnsub === "function") bizUnsub(); bizUnsub = null;
  if (!ids.length) { S.bizTxns = []; return; }
  bizUnsub = S.db.collection("transactions").where("accountId", "in", ids).where("date", ">=", yearStart).orderBy("date", "desc").limit(1000)
    .onSnapshot(s => { S.bizTxns = docs(s); render(); }, fail);
}
async function start() {
  S.chat = S.chatBy[S.space]; setTab(S.lastTab[S.space] || SPACES[S.space].tabs[0][0]);
  render(true);
  window.claude?.use?.("permissions").then(p => { S.perms = p || null; }).catch(() => {});
  window.claude?.use?.("sample").then(async fn => {
    S.sample = fn;
    if (!fn) S.samplePerm = await S.perms?.state?.("sample").catch(() => null) ?? null;
    if (fn) S.sampleTools = !!(await fn.limits().catch(() => null))?.tools;
    if (S.tab === "ask") render();
  });
  const db = await window.claude?.use?.("db");
  if (!db) { render(true); return; }
  S.db = db;
  try { const user = await window.claude.use("user"); const w = user?.can?.("data.write"); if (w === false) S.canWrite = false; S.me = await user?.id?.() ?? null; } catch (e) {}
  const cutoff = `${lastMonths(7)[0]}-01`;
  db.collection("accounts").onSnapshot(s => { S.accounts = docs(s).sort((a, b) => (a.institution + a.name).localeCompare(b.institution + b.name)); S.ready.accounts = true; splitTxns(); watchBiz(); render(); }, fail);
  db.collection("transactions").where("date", ">=", cutoff).orderBy("date", "desc").limit(1000).onSnapshot(s => { S.allTxns = docs(s); splitTxns(); S.ready.txns = true; render(); }, fail);
  db.collection("invoices").onSnapshot(s => { S.invoices = docs(s); render(); }, fail);
  db.collection("mileage").where("date", ">=", `${year - 1}-01-01`).onSnapshot(s => { S.mileage = docs(s); render(); }, fail);
  db.collection("taxPayments").onSnapshot(s => { S.taxPayments = docs(s); render(); }, fail);
  db.doc("meta/business").onSnapshot(s => { S.bizMeta = s.exists ? s.data() : null; render(); }, () => {});
  db.collection("balances").orderBy("date", "desc").limit(400).onSnapshot(s => { S.balances = docs(s); render(); }, fail);
  db.collection("budgets").onSnapshot(s => { S.budgets = docs(s); render(); }, fail);
  db.collection("bills").onSnapshot(s => { S.bills = docs(s); render(); }, fail);
  db.collection("questions").orderBy("askedAt", "desc").limit(60).onSnapshot(s => { S.questions = docs(s); if (S.tab === "ask") render(); }, () => {});
  db.doc("meta/sync").onSnapshot(s => { S.meta = s.exists ? s.data() : null; render(); }, () => {});
}
start();
</script>
